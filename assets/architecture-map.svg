<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 372" width="860" height="372">
  <defs>
    <linearGradient id="ar-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B160E"/>
      <stop offset="100%" stop-color="#060B07"/>
    </linearGradient>
    <pattern id="ar-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" fill-opacity="0.24"/>
    </pattern>
    <filter id="ar-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="2.0" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="ar-clip">
      <rect x="2" y="2" width="856" height="368" rx="12"/>
    </clipPath>
  </defs>
  <style>
    .mono { font-family: 'Courier New', Consolas, 'Liberation Mono', monospace; }
    .title { font-family: 'Courier New', Consolas, 'Liberation Mono', monospace; font-weight: 700; fill: #18FF62; letter-spacing: 1.2px; }
    .sub { font-family: 'Courier New', Consolas, 'Liberation Mono', monospace; fill: #B8E6C1; }
    .dim { font-family: 'Courier New', Consolas, 'Liberation Mono', monospace; fill: #6FA67D; }
    .gold { font-family: 'Courier New', Consolas, 'Liberation Mono', monospace; font-weight: 700; fill: #F6D04D; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.32; } }
    @keyframes sweep {
      0% { transform: translateY(-20px); opacity: 0; }
      15% { opacity: 0.12; }
      85% { opacity: 0.12; }
      100% { transform: translateY(372px); opacity: 0; }
    }
    .blink { animation: blink 1.1s steps(1) infinite; }
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
    .sweep { animation: sweep 5.8s linear infinite; }
  </style>
  <style>
    @keyframes flow { to { stroke-dashoffset: -28; } }
    .flow { stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
  </style>
  <rect x="2" y="2" width="856" height="368" rx="12" fill="url(#ar-bg)" stroke="#1E4D2B" stroke-width="2"/>
  <rect x="6" y="6" width="848" height="360" rx="9" fill="none" stroke="#18FF62" stroke-opacity="0.25" stroke-width="1"/>
  <g clip-path="url(#ar-clip)">
    <rect x="0" y="0" width="860" height="18" fill="#18FF62" class="sweep"/>
  </g>
  <rect x="2" y="2" width="856" height="368" rx="12" fill="url(#ar-scan)" pointer-events="none"/>
  <!-- Corner ticks -->
  <path d="M 14 26 L 14 14 L 26 14" fill="none" stroke="#18FF62" stroke-width="2"/>
  <path d="M 834 14 L 846 14 L 846 26" fill="none" stroke="#18FF62" stroke-width="2"/>
  <path d="M 14 346 L 14 358 L 26 358" fill="none" stroke="#18FF62" stroke-width="2"/>
  <path d="M 834 358 L 846 358 L 846 346" fill="none" stroke="#18FF62" stroke-width="2"/>
  <!-- Top Tab Bar (single active tab) -->
  <rect x="28" y="12" width="118" height="24" rx="2" fill="#18FF62" fill-opacity="0.14"/>
  <path d="M 28 36 L 28 12 L 146 12 L 146 36" fill="none" stroke="#18FF62" stroke-width="1.5"/>
  <text x="87" y="28" text-anchor="middle" font-size="11.5" font-weight="700" class="mono" fill="#18FF62">ARCHITECTURE</text>
  <text x="832" y="27" text-anchor="end" font-size="11" class="dim">SYSTEMS // TOPOLOGY</text>
  <line x1="22" y1="36" x2="28" y2="36" stroke="#18FF62" stroke-opacity="0.7" stroke-width="1.5"/>
  <line x1="146" y1="36" x2="838" y2="36" stroke="#18FF62" stroke-opacity="0.7" stroke-width="1.5"/>

  <!-- Section Column Labels -->
  <text x="128" y="60" text-anchor="middle" font-size="10.8" font-weight="700" class="gold">[ PORTABLE USB NODE ]</text>
  <text x="421" y="60" text-anchor="middle" font-size="10.8" font-weight="700" class="gold">[ HARDWARE-AWARE AI ROUTING ]</text>
  <text x="715" y="60" text-anchor="middle" font-size="10.8" font-weight="700" class="gold">[ NETWORK &amp; SECURITY LAB ]</text>

  <!-- Animated flow connectors (USB -> Model Tiers / LiteLLM) -->
  <path d="M 230 154 L 286 106" fill="none" stroke="#18FF62" stroke-width="2" class="flow"/>
  <path d="M 230 185 L 286 185" fill="none" stroke="#18FF62" stroke-width="2" class="flow"/>
  <path d="M 230 216 L 286 264" fill="none" stroke="#F6D04D" stroke-width="2" class="flow"/>

  <!-- Pillar Divider (Portable AI | Network & Security Lab) -->
  <line x1="576" y1="68" x2="576" y2="300" stroke="#1E4D2B" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- Left: Portable USB AI Node -->
  <rect x="26" y="102" width="204" height="166" rx="7" fill="#0D1C11" stroke="#18FF62" stroke-width="1.5"/>
  <circle cx="43" cy="122" r="4" fill="#18FF62" class="pulse"/>
  <text x="55" y="126" font-size="12" font-weight="700" class="mono" fill="#18FF62">PORTABLE USB DRIVE</text>
  <line x1="38" y1="137" x2="218" y2="137" stroke="#1E4D2B" stroke-width="1"/>
  <text x="40" y="158" font-size="11.2" class="sub">Runtime: llama.cpp</text>
  <text x="40" y="178" font-size="11.2" class="sub">Models: Quantized GGUF</text>
  <text x="40" y="198" font-size="11.2" class="sub">Entry: windows_start.bat</text>
  <text x="40" y="218" font-size="11.2" class="sub">Check: Host RAM Tier</text>
  <text x="40" y="244" font-size="10" class="dim">Zero-install cross-device</text>
  <text x="40" y="258" font-size="10" class="dim">Windows execution</text>

  <!-- Center: Tiered Model Targets -->
  <rect x="286" y="72" width="270" height="68" rx="6" fill="#0D1C11" stroke="#18FF62" stroke-width="1.3"/>
  <text x="300" y="94" font-size="11" font-weight="700" class="mono" fill="#18FF62">HOST &lt;= 16GB RAM (LAPTOP)</text>
  <text x="300" y="113" font-size="11.5" class="sub">&gt; Qwen 2.5 Coder 7B (GGUF)</text>
  <text x="300" y="129" font-size="10" class="dim">Low-footprint offline coding</text>

  <rect x="286" y="151" width="270" height="68" rx="6" fill="#0D1C11" stroke="#18FF62" stroke-width="1.3"/>
  <text x="300" y="173" font-size="11" font-weight="700" class="mono" fill="#18FF62">HOST &gt;= 20GB RAM (WORKSTATION)</text>
  <text x="300" y="192" font-size="11.5" class="sub">&gt; Qwen 3 Coder 30B-A3B</text>
  <text x="300" y="208" font-size="10" class="dim">High-capacity MoE local inference</text>

  <rect x="286" y="230" width="270" height="68" rx="6" fill="#0D1C11" stroke="#F6D04D" stroke-width="1.3"/>
  <text x="300" y="252" font-size="11" font-weight="700" class="gold">DASHBOARD &amp; CLOUD (LITELLM)</text>
  <text x="300" y="271" font-size="11.5" class="sub">&gt; Streamlit UI + API Router</text>
  <text x="300" y="287" font-size="10" class="dim">Local-first + optional cloud fallback</text>

  <!-- Right: Network & Security Lab -->
  <rect x="596" y="72" width="238" height="68" rx="6" fill="#0D1C11" stroke="#1E4D2B" stroke-width="1.3"/>
  <text x="610" y="94" font-size="11" font-weight="700" class="mono" fill="#18FF62">RAW TCP + FSM ENGINE</text>
  <text x="610" y="113" font-size="11.2" class="sub">Binary JSON Framing</text>
  <text x="610" y="129" font-size="10" class="dim">Authoritative DNS + Multi-thread</text>

  <rect x="596" y="151" width="238" height="68" rx="6" fill="#0D1C11" stroke="#1E4D2B" stroke-width="1.3"/>
  <text x="610" y="173" font-size="11" font-weight="700" class="mono" fill="#18FF62">SPLIT-BRAIN DEFENSE</text>
  <text x="610" y="192" font-size="11.2" class="sub">PID Fencing + HMAC-SHA256</text>
  <text x="610" y="208" font-size="10" class="dim">Tamper-evident checkpoints</text>

  <rect x="596" y="230" width="238" height="68" rx="6" fill="#0D1C11" stroke="#1E4D2B" stroke-width="1.3"/>
  <text x="610" y="252" font-size="11" font-weight="700" class="mono" fill="#18FF62">PKI &amp; AUDIT TOOLCHAIN</text>
  <text x="610" y="271" font-size="11.2" class="sub">OpenSSL / Syft / Grype</text>
  <text x="610" y="287" font-size="10" class="dim">Wireshark / Kali / CML / Azure</text>

  <!-- Legend -->
  <line x1="26" y1="312" x2="834" y2="312" stroke="#1E4D2B" stroke-width="1"/>
  <text x="430" y="328" text-anchor="middle" font-size="10.2" class="dim">LEGEND:  [---] GREEN = OFFLINE LOCAL PATH   |   [---] GOLD = OPTIONAL CLOUD ROUTING</text>

  <!-- 2-segment HUD footer -->
  <rect x="26" y="338" width="400" height="20" rx="2" fill="#0F2917" stroke="#1E4D2B" stroke-width="1"/>
  <text x="38" y="352" font-size="10.5" font-weight="700" class="mono" fill="#18FF62">PORTABLE AI INFRASTRUCTURE</text>
  <rect x="434" y="338" width="400" height="20" rx="2" fill="#0F2917" stroke="#1E4D2B" stroke-width="1"/>
  <text x="822" y="352" text-anchor="end" font-size="10.5" font-weight="700" class="mono" fill="#F6D04D">NETWORK &amp; SECURITY LABS</text>
</svg>
