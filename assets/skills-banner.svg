<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 166" width="860" height="166">
  <defs>
    <linearGradient id="sk-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B160E"/>
      <stop offset="100%" stop-color="#060B07"/>
    </linearGradient>
    <pattern id="sk-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" fill-opacity="0.24"/>
    </pattern>
    <filter id="sk-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="2.0" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="sk-clip">
      <rect x="2" y="2" width="856" height="162" rx="12"/>
    </clipPath>
  </defs>
  <style>
    .mono { font-family: 'Courier New', Consolas, 'Liberation Mono', monospace; }
    .title { font-family: 'Courier New', Consolas, 'Liberation Mono', monospace; font-weight: 700; fill: #18FF62; letter-spacing: 1.2px; }
    .sub { font-family: 'Courier New', Consolas, 'Liberation Mono', monospace; fill: #B8E6C1; }
    .dim { font-family: 'Courier New', Consolas, 'Liberation Mono', monospace; fill: #6FA67D; }
    .gold { font-family: 'Courier New', Consolas, 'Liberation Mono', monospace; font-weight: 700; fill: #F6D04D; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.32; } }
    @keyframes sweep {
      0% { transform: translateY(-20px); opacity: 0; }
      15% { opacity: 0.12; }
      85% { opacity: 0.12; }
      100% { transform: translateY(166px); opacity: 0; }
    }
    .blink { animation: blink 1.1s steps(1) infinite; }
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
    .sweep { animation: sweep 5.8s linear infinite; }
  </style>
  <rect x="2" y="2" width="856" height="162" rx="12" fill="url(#sk-bg)" stroke="#1E4D2B" stroke-width="2"/>
  <rect x="6" y="6" width="848" height="154" rx="9" fill="none" stroke="#18FF62" stroke-opacity="0.25" stroke-width="1"/>
