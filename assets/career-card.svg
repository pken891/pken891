<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 282" width="860" height="282">
  <defs>
    <linearGradient id="cr-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B160E"/>
      <stop offset="100%" stop-color="#060B07"/>
    </linearGradient>
    <pattern id="cr-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" fill-opacity="0.24"/>
    </pattern>
    <filter id="cr-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="2.0" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cr-clip">
      <rect x="2" y="2" width="856" height="278" rx="12"/>
    </clipPath>
  </defs>
  <style>
    .mono { font-family: 'Courier New', Consolas, 'Liberation Mono', monospace; }
    .title { font-family: 'Courier New', Consolas, 'Liberation Mono', monospace; font-weight: 700; fill: #18FF62; letter-spacing: 1.2px; }
    .sub { font-family: 'Courier New', Consolas, 'Liberation Mono', monospace; fill: #B8E6C1; }
    .dim { font-family: 'Courier New', Consolas, 'Liberation Mono', monospace; fill: #6FA67D; }
    .gold { font-family: 'Courier New', Consolas, 'Liberation Mono', monospace; font-weight: 700; fill: #F6D04D; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.32; } }
    @keyframes sweep {
      0% { transform: translateY(-20px); opacity: 0; }
      15% { opacity: 0.12; }
      85% { opacity: 0.12; }
      100% { transform: translateY(282px); opacity: 0; }
    }
    .blink { animation: blink 1.1s steps(1) infinite; }
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
    .sweep { animation: sweep 5.8s linear infinite; }
  </style>
  <rect x="2" y="2" width="856" height="278" rx="12" fill="url(#cr-bg)" stroke="#1E4D2B" stroke-width="2"/>
  <rect x="6" y="6" width="848" height="270" rx="9" fill="none" stroke="#18FF62" stroke-opacity="0.25" stroke-width="1"/>
  <g clip-path="url(#cr-clip)">
    <rect x="0" y="0" width="860" height="18" fill="#18FF62" class="sweep"/>
  </g>
  <rect x="2" y="2" width="856" height="278" rx="12" fill="url(#cr-scan)" pointer-events="none"/>
  <!-- Corner ticks -->
  <path d="M 14 26 L 14 14 L 26 14" fill="none" stroke="#18FF62" stroke-width="2"/>
  <path d="M 834 14 L 846 14 L 846 26" fill="none" stroke="#18FF62" stroke-width="2"/>
  <path d="M 14 256 L 14 268 L 26 268" fill="none" stroke="#18FF62" stroke-width="2"/>
  <path d="M 834 268 L 846 268 L 846 256" fill="none" stroke="#18FF62" stroke-width="2"/>
  <!-- Top Pip-Boy Tab Bar -->
  <text x="69.0" y="28" text-anchor="middle" font-size="11.5" class="mono" fill="#4E8A5E">SKILLS</text><text x="161.0" y="28" text-anchor="middle" font-size="11.5" class="mono" fill="#4E8A5E">PROJECTS</text><text x="253.0" y="28" text-anchor="middle" font-size="11.5" class="mono" fill="#4E8A5E">ARCH</text><text x="345.0" y="28" text-anchor="middle" font-size="11.5" class="mono" fill="#4E8A5E">AI</text><rect x="396" y="12" width="82" height="24" rx="2" fill="#18FF62" fill-opacity="0.14"/><path d="M 396 36 L 396 12 L 478 12 L 478 36" fill="none" stroke="#18FF62" stroke-width="1.5"/><text x="437.0" y="28" text-anchor="middle" font-size="11.5" font-weight="700" class="mono" fill="#18FF62">CAREER</text>
  <text x="832" y="27" text-anchor="end" font-size="11" class="dim">AVAILABILITY // EARLY-CAREER</text>
  <line x1="22" y1="36" x2="396" y2="36" stroke="#18FF62" stroke-opacity="0.7" stroke-width="1.5"/><line x1="478" y1="36" x2="838" y2="36" stroke="#18FF62" stroke-opacity="0.7" stroke-width="1.5"/>
  <!-- Pip-Boy 3-segment HUD footer -->
  <rect x="26" y="248" width="236" height="20" rx="2" fill="#0F2917" stroke="#1E4D2B" stroke-width="1"/>
  <text x="36" y="262" font-size="10.5" font-weight="700" class="mono" fill="#18FF62">FORT COLLINS, CO</text>
  <rect x="270" y="248" width="320" height="20" rx="2" fill="#0F2917" stroke="#1E4D2B" stroke-width="1"/>
  <text x="430" y="262" text-anchor="middle" font-size="10.5" class="sub">CSU // CS &amp; INFO SYSTEMS</text>
  <rect x="598" y="248" width="236" height="20" rx="2" fill="#0F2917" stroke="#1E4D2B" stroke-width="1"/>
  <text x="824" y="262" text-anchor="end" font-size="10.5" font-weight="700" class="mono" fill="#F6D04D">OPEN TO ROLES</text>

  <!-- Card Header -->
  <circle cx="36" cy="61" r="4.5" fill="#F6D04D" class="pulse"/>
  <text x="50" y="66" font-size="15" font-weight="700" class="gold">OPEN TO OPPORTUNITIES // INTERNSHIPS &amp; ENTRY-LEVEL ROLES</text>

  <!-- Left Column: Education & Focus -->
  <rect x="26" y="80" width="394" height="156" rx="6" fill="#0D1C11" stroke="#1E4D2B" stroke-width="1.3"/>
  <text x="42" y="103" font-size="12" font-weight="700" class="mono" fill="#18FF62">[ EDUCATION &amp; FOCUS ]</text>
  <line x1="42" y1="111" x2="404" y2="111" stroke="#1E4D2B" stroke-width="1"/>
  <text x="42" y="133" font-size="11.5" class="sub">&gt; B.S. Computer Science &amp; Info Systems</text>
  <text x="56" y="149" font-size="10.8" class="dim">Colorado State University</text>
  <text x="42" y="172" font-size="11.5" class="sub">&gt; Target Roles:</text>
  <text x="56" y="188" font-size="11.2" class="sub">InfoSec, Cloud/SWE, IT Support</text>
  <text x="42" y="211" font-size="11.5" class="sub">&gt; Focus: Hardening systems &amp; protecting</text>
  <text x="56" y="226" font-size="11.2" class="sub">everyday users from cyber threats</text>

  <!-- Right Column: Hands-On Experience -->
  <rect x="440" y="80" width="394" height="156" rx="6" fill="#0D1C11" stroke="#1E4D2B" stroke-width="1.3"/>
  <text x="456" y="103" font-size="12" font-weight="700" class="mono" fill="#18FF62">[ HANDS-ON EXPERIENCE ]</text>
  <line x1="456" y1="111" x2="818" y2="111" stroke="#1E4D2B" stroke-width="1"/>
  <text x="456" y="133" font-size="11.5" class="sub">&gt; Tech office IT &amp; systems operations</text>
  <text x="456" y="156" font-size="11.5" class="sub">&gt; Fault-tolerant &amp; HMAC-verified systems</text>
  <text x="456" y="179" font-size="11.5" class="sub">&gt; Raw TCP protocols &amp; Cisco/DNS labs</text>
  <text x="456" y="202" font-size="11.5" class="sub">&gt; Portable USB local AI (llama.cpp)</text>
  <text x="456" y="225" font-size="11.5" class="sub">&gt; PKI, SBOM &amp; vulnerability auditing</text>
</svg>
